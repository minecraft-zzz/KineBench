repo_root: /zzz_new/projects/KineBench
third_party_root: /zzz_new/projects/KineBench/third_party
run_name: fake_close_faucet_video
output_dir: outputs
timestamp_outputs: true
env_id: CloseFaucet-v1
num_episodes: 5
seed: 43
fps: 17
overwrite_episode: true
add_visual_lock_prompt: true

runtime:
  # Fake generated video -> FoundationPose pose -> ManiSkill pd_ee_pose rollout.
  # PyRoki is only used for optional manipulation cost, not for IK actions.
  control_mode: pd_ee_pose
  sim_backend: cpu
  background_type_id: [-1, -1]
  background: RoboCasa
  action_length: 250
  action_repeat: 4
  max_rollouts: 3
  bg_separate: 1.0

# This is the fake generator. The script scripts/run_fake_video_eval.py also overrides these fields.
output:
  save_attempts: false
  save_generated: false
  save_h5: true

generation:
  kind: local
  path: /data/zzz/kinebench/datasets/hf_datasets/hf_datasets_new/suite0/videos/videos/close_faucet_31/observation.images.base_camera.mp4
  target_frames: 49
  size: [384, 384]

prompts:
  CloseBox-v1: "In the following video, based on the current visual state, determine the task progress and continue to complete the remaining steps. Task: CloseBox-v1. A box is placed on its side in front of the robot arm. The box lid is open. Move the gripper to hover above the lid, then apply a gentle downward press with a slight rightward component to fold the lid shut until it is fully closed. Finish when the lid is completely closed, then retract the gripper. Do not try to open the box; do not hook under the lid to lift it; do not push in a way that re-opens the lid."

perception:
  # Supports absolute paths or placeholders: {episode_dir}, {episode_name}.
  fp_workspace: /zzz_new/projects/KineBench/tmp/fp_workspace_fake_close_faucet/{episode_name}
  cad_path: /zzz_new/projects/KineBench/assets/CADassets/maniskill_franka
  yolo_weights: /zzz_new/projects/KineBench/checkpoints/yolo/results/maniskill15x100/weights/best.pt
  moge_checkpoint: /zzz_new/projects/KineBench/checkpoints/MoGe/workspace/benchmark0v1/debug/checkpoint/00030000.pt
  foundationpose_repo: /zzz_new/projects/KineBench/third_party/FoundationPose-main
  conda_bin: /opt/miniconda3/condabin/conda
  foundationpose_env: foundationpose
  workspace_workers: 8
  fp_workers: 8
  yolo_imgsz: 384
  yolo_conf: 0.15
  fov_x: 60
  device: cuda:0

pyroki:
  repo: /zzz_new/projects/KineBench/third_party/pyroki-main
  conda_bin: /opt/miniconda3/condabin/conda
  env_name: pyroki
  manipulability_weight: 0.2
  compute_cost: true
  use_ik_actions: false
  robot_urdf_file: /zzz_new/projects/KineBench/third_party/ManiSkill-main/mani_skill/assets/robots/panda/panda_v2.urdf
  robot_mesh_dir: /zzz_new/projects/KineBench/third_party/ManiSkill-main/mani_skill/assets/robots/panda/franka_description/meshes/collision

gripper:
  enabled: true
  default: -1.0
  videox_fun_utils: /zzz_new/projects/gemini/VideoX_Fun_GRPO/videox_fun/utils
  yolo_pose_weights: /zzz_new/projects/KineBench/checkpoints/yolo/results/gripper_pose_6x200/weights/best.pt
  mlp_ckpt: /zzz_new/projects/gemini/DINOv3/runs/run11_15v2_3frames/best.pt
  dino_repo: /zzz_new/projects/gemini/DINOv3/DINOv3_hf_weight
  device: cuda:0
  yolo_imgsz: 512
  yolo_batch: 256
  yolo_conf: 0.5
  low_conf_warn: 0.5
  use_depth: false
  map_labels_to_actions: true
  close_label: 0
  open_action: 1.0
  close_action: -1.0
